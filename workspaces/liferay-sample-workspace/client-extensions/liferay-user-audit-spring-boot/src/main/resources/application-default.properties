#
# OAuth
#

liferay.oauth.application.external.reference.codes=\
    liferay-user-audit-spring-boot-oaua,\
    liferay-user-audit-spring-boot-oahs

liferay.oauth.urls.excludes=/ready

liferay.user.audit.oauth.headless.server.erc=\
    liferay-user-audit-spring-boot-oahs

#
# JWT validation
#
# Issuer validation is enforced by default so that production rejects any
# token whose "iss" claim does not match the expected issuer. The expected
# issuer defaults to the Liferay DXP URL (derived from the LXC environment).
# Override it with liferay.oauth.jwt.issuer if your portal issues a different
# value. For local development against an instance whose issuer differs, you
# may disable validation by setting the "enabled" property to false.
#

liferay.oauth.jwt.issuer.validation.enabled=true

#
# Spring Boot
#

server.port=58099
